[project]
name = "session-kit"
version = "0.1.0"
description = "Turn a session recording into a poster, a corrected transcript, shorts, and a memo recording sidecar"
requires-python = ">=3.12"
dependencies = [
  "mlx-whisper>=0.4.2",
  "pillow>=11.0",
  "playwright>=1.49",
  "pyyaml>=6.0",
]

[project.scripts]
session-kit = "session_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Plex Sans'; font-weight: 400; src: url('{{fonts}}/IBMPlexSans-400.ttf'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 500; src: url('{{fonts}}/IBMPlexSans-500.ttf'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 600; src: url('{{fonts}}/IBMPlexSans-600.ttf'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 700; src: url('{{fonts}}/IBMPlexSans-700.ttf'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 400; src: url('{{fonts}}/IBMPlexMono-400.ttf'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 500; src: url('{{fonts}}/IBMPlexMono-500.ttf'); }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #ffffff;
    color: #23252c;
    font-family: 'Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 52px 80px 50px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    right: -140px;
    top: -140px;
    width: 560px;
    height: 560px;
    background:
      linear-gradient(135deg, transparent 49.6%, #ededed 49.6%, #ededed 50.4%, transparent 50.4%) 0 0 / 104px 104px,
      linear-gradient(45deg, transparent 49.6%, #f3f3f3 49.6%, #f3f3f3 50.4%, transparent 50.4%) 0 0 / 104px 104px;
    -webkit-mask-image: radial-gradient(circle at 70% 30%, #000 20%, transparent 68%);
  }

  .brand { display: flex; align-items: center; gap: 16px; position: relative; }
  .brand img { width: 40px; height: 42px; }
  .brand .name { font-weight: 700; font-size: 15px; line-height: 1.3; letter-spacing: 0.02em; text-transform: uppercase; }
  .brand .site { margin-left: auto; font-family: 'Plex Mono', monospace; font-size: 18px; color: #9b9b9b; letter-spacing: 0.02em; }

  .copy { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; padding: 20px 0; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9b9b9b; }
  .eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: #e13f5e; }
  .title {
    margin-top: 16px;
    font-size: 56px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.012em;
    text-wrap: balance;
  }
  .subtitle {
    margin-top: 18px;
    font-size: 24px;
    line-height: 1.42;
    color: #4a4c52;
    text-wrap: pretty;
  }

  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; position: relative; }
  .who { font-size: 22px; font-weight: 600; line-height: 1.25; min-width: 0; }
  .who > span { display: block; }
  .who small { display: block; font-size: 17px; font-weight: 400; color: #636466; margin-top: 4px; font-family: 'Plex Mono', monospace; }
  .play {
    display: flex; align-items: center; gap: 12px; flex: none;
    background: #e13f5e; color: #fff;
    padding: 10px 20px 10px 16px; border-radius: 4px;
    font-size: 19px; font-weight: 500;
  }
  .play svg { width: 17px; height: 17px; fill: #fff; }
  .play .len { font-family: 'Plex Mono', monospace; font-size: 17px; opacity: 0.85; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-conic-gradient(#e13f5e 0 25%, transparent 0 50%) 0 0 / 10px 10px; opacity: 0.85; }
</style>
</head>
<body>
  <div class="brand">
    <img src="{{logo}}" alt="">
    <div class="name">Dwarves<br>Foundation</div>
    <div class="site">memo.d.foundation</div>
  </div>

  <div class="copy">
    <div class="eyebrow"><span class="dot"></span><span data-slot="series" data-max-lines="1">{{series}}</span></div>
    <h1 class="title" data-slot="title" data-max-lines="3">{{title}}</h1>
    <p class="subtitle" data-slot="subtitle" data-max-lines="2">{{subtitle}}</p>
  </div>

  <div class="foot">
    <div class="who"><span data-slot="speaker" data-max-lines="1">{{speaker}}</span><small>{{meta}}</small></div>
    <div class="play">
      <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>
      <span>{{watch_label}}</span>
      <span class="len">{{duration}}</span>
    </div>
  </div>
  <div class="rule"></div>
</body>
</html>
